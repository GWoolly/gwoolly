<!-- Portfolio Grid Section -->
<section id="portfolio">
  <div class="container portfolio-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Portfolio</h2>
        <hr class="star-div gamepad";>
      </div>
    </div>
	
	<!-- Filter Buttons -->
	<div class="text-center">
		<button class="btn btn-primary filter-btn" data-filter="all">All</button>
		<button class="btn btn-secondary filter-btn" data-filter="QA">QA</button>
		<button class="btn btn-secondary filter-btn" data-filter="Design">Design</button>
	</div>
	
	<!-- Portfolio Grid -->
    <div class="portfolio-flex-row">
	  {% for post in site.posts %}
<div class="portfolio-flex-item portfolio-item" data-category="{{ post.category | join: ',' }}">
  <div class="portfolio-wrapper">
    <a href="#portfolioModal-{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
      <div class="caption">
        <div class="caption-content"></div>
      </div>
      <img src="img/portfolio/{{ post.img }}" class="img-responsive" alt="{{ post.alt }}">
    </a>
  </div>
</div>

      {% endfor %}
    
	</div>
  </div>
</section>
