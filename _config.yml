# Site settings
title: Grant Woolley
formspree: https://formspree.io/f/mgvaedoe
email: woollygrant@gmail.com
url: https://github.com/GWoolly/gwoolly
# url: https://github.com/jeromelachaud/freelancer-theme
description: "Check out Grant's portfolio, we should totally hire him!"
keywords: "Quality assurance, QA Tester, QA Testing, games testing, games tester, Games Design, Pixel art, pixelart, pixel artist"
skills: "Quality Assurance - Games Design - Pixel Art"
meta_author: Woolley Grant

# Password Protected Content - Currently configuration is within portfolio.js
# nda: 
    # password: "please"
    # cookie_duration: 7
    # param: "nda"

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Contact form:
# - static : pass through formspree.io to validate email sending
# - disqus : replace contact form by disqus thread
# - comment the line below if you want to stick with the default PHP contact form
contact: static

# If you use disqus you need disqus shortname
# https://help.disqus.com/customer/portal/articles/466208
disqus_shortname: myshortname

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: db4d5b #80B3FF
  primary-rgb: "354,65,86" #"128,179,255"
  secondary: 2c3e50 #FD6E8A
  secondary-dark: 233140 #A2122F

# Footer settings
footer:
  copyright: Grant Woolley
  location: Location
  social: Around the Web
  credits: Credits

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: linkedin
    url: https://www.linkedin.com/in/grantwoolley/
  - title: github
    url: http://github.com/gwoolly
  - title: itch-io
    url: https://gwoolley.itch.io/
  # - title: steam
    # url: https://steamcommunity.com/profiles/76561198057387248/
  # - title: playstation
    # url: http://github.com/gwoolly
  # - title: xbox
    # url: http://github.com/gwoolly

# Postal address (add as many lines as necessary)
address:
  - line: Portsmouth, United Kingdom

# Credits content
credits: 'Modified from <a href="http://startbootstrap.com">Start Bootstrap</a> Freelancer theme for Jekyll sites.'

# Build settings
markdown: kramdown
kramdown:
    # Use Github's extended markdown format
    input: GFM
    # do not replace newlines by <br>s
    hard_wrap: false
    # parse markdown inside block-level HTML tag
    # parse_block_html: true
    # parse_span_html: true
    # remove_block_html_tags: false
plugins_dir: _plugins
permalink: pretty

#for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: /:title/
